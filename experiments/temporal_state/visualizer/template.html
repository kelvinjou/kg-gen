            // Canvas-based network visualization
            let canvas, ctx, transform, simulation, zoom;
            let nodes, edges;
            let highlightedNodes = new Set();
            let highlightedEdges = new Set();
            let isFiltering = false;
            let simulationGeneration = 0;
            let userAdjustedView = false;
            let edgePulseStartedAt = 0;
            let edgePulseFrame = null;
            const edgePulseDuration = 4500;

            function updatedEdgePulseStrength() {
                if (!edgePulseStartedAt) return 0;
                const elapsed = performance.now() - edgePulseStartedAt;
                if (elapsed >= edgePulseDuration) return 0;
                const wave = (Math.sin(elapsed / 240) + 1) / 2;
                return wave * (1 - elapsed / edgePulseDuration * 0.35);
            }

            function startUpdatedEdgePulse() {
                if (edgePulseFrame !== null) {
                    cancelAnimationFrame(edgePulseFrame);
                    edgePulseFrame = null;
                }
                edgePulseStartedAt = performance.now();
                if (!edges?.some(edge => edge.updated)) {
                    render();
                    return;
                }

                function animate(now) {
                    render();
                    if (now - edgePulseStartedAt < edgePulseDuration) {
                        edgePulseFrame = requestAnimationFrame(animate);
                    } else {
                        edgePulseFrame = null;
                        render();
                    }
                }

                edgePulseFrame = requestAnimationFrame(animate);
            }

            function fitNetworkToViewport(animate = true) {
                if (!canvas || !zoom || !nodes?.length || userAdjustedView) return;

                const positionedNodes = nodes.filter(node =>
                    Number.isFinite(node.x) && Number.isFinite(node.y)
                );
                if (!positionedNodes.length) return;

                const bounds = positionedNodes.reduce((result, node) => {
                    const radius = node.radius || 18;
                    result.minX = Math.min(result.minX, node.x - radius);
                    result.maxX = Math.max(result.maxX, node.x + radius);
                    result.minY = Math.min(result.minY, node.y - radius);
                    // Include room for the label rendered beneath each node.
                    result.maxY = Math.max(result.maxY, node.y + radius + 24);
                    return result;
                }, {
                    minX: Infinity,
                    maxX: -Infinity,
                    minY: Infinity,
                    maxY: -Infinity
                });

                const rect = canvas.getBoundingClientRect();
                const width = Math.max(rect.width, 320);
                const height = Math.max(rect.height, 200);
                const horizontalPadding = Math.min(80, width * 0.1);
                const topPadding = 28;
                const bottomPadding = snapshots.length > 1 ? 112 : 28;
                const availableWidth = Math.max(1, width - horizontalPadding * 2);
                const availableHeight = Math.max(1, height - topPadding - bottomPadding);
                const graphWidth = Math.max(1, bounds.maxX - bounds.minX);
                const graphHeight = Math.max(1, bounds.maxY - bounds.minY);

                // Dense and large graphs get a lower zoom ceiling so labels and
                // edges do not crowd the viewport. Sparse, small graphs may zoom in.
                const nodeCount = positionedNodes.length;
                const density = Math.max(0, Math.min(1, Number(vizData.stats?.density) || 0));
                const maxScale = nodeCount <= 3
                    ? 1.8
                    : nodeCount <= 10
                        ? 1.35
                        : nodeCount <= 25
                            ? 1.05
                            : 0.9;
                const densityAdjustment = 1 - density * 0.25;
                const fitScale = Math.min(
                    availableWidth / graphWidth,
                    availableHeight / graphHeight
                );
                const scale = Math.max(
                    0.25,
                    Math.min(maxScale, fitScale * densityAdjustment)
                );

                const graphCenterX = (bounds.minX + bounds.maxX) / 2;
                const graphCenterY = (bounds.minY + bounds.maxY) / 2;
                const viewportCenterX = width / 2;
                const viewportCenterY = topPadding + availableHeight / 2;
                const targetTransform = d3.zoomIdentity
                    .translate(
                        viewportCenterX - scale * graphCenterX,
                        viewportCenterY - scale * graphCenterY
                    )
                    .scale(scale);
                const selection = d3.select(canvas).interrupt();

                if (animate) {
                    selection
                        .transition()
                        .duration(350)
                        .call(zoom.transform, targetTransform);
                } else {
                    selection.call(zoom.transform, targetTransform);
                }
            }

            function startSimulation(width, height) {
                if (simulation) {
                    simulation.stop();
                }

                const generation = ++simulationGeneration;
                let tickCount = 0;
                nodes = vizData.nodes.map(node => ({ ...node }));
                edges = vizData.edges.map(edge => ({ ...edge }));
                simulation = d3
                    .forceSimulation(nodes)
                    .force('link', d3.forceLink(edges).id(d => d.id).distance(120).strength(0.3))
                    .force('charge', d3.forceManyBody().strength(-280))
                    .force('center', d3.forceCenter(width / 2, height / 2))
                    .force('collision', d3.forceCollide().radius(d => d.radius + 12))
                    .on('tick', () => {
                        render();
                        tickCount += 1;
                        if (tickCount === 35 && generation === simulationGeneration) {
                            fitNetworkToViewport();
                        }
                    })
                    .on('end', () => {
                        if (generation === simulationGeneration) {
                            fitNetworkToViewport();
                        }
                    });
            }

            function refreshNetwork() {
                if (!canvas || !ctx) return;

                const rect = canvas.getBoundingClientRect();
                const width = Math.max(rect.width, 320);
                const height = Math.max(rect.height, 200);
                userAdjustedView = false;
                startSimulation(width, height);

                if (zoom) {
                    d3.select(canvas).interrupt().call(
                        zoom.transform,
                        d3.zoomIdentity
                    );
                } else {
                    transform = d3.zoomIdentity;
                }
                render();
            }

            function createNetwork() {
                console.log('[iframe] createNetwork starting...');

                if (typeof d3 === 'undefined') {
                    console.error('[iframe] D3.js not loaded!');
                    return;
                }
                console.log('[iframe] D3.js version:', d3.version);

                canvas = document.getElementById('networkCanvas');
                if (!canvas) {
                    console.error('[iframe] Canvas element not found!');
                    return;
                }

                ctx = canvas.getContext('2d');
                if (!ctx) {
                    console.error('[iframe] Canvas context not available!');
                    return;
                }

                // Force a layout recalculation to ensure proper sizing
                canvas.offsetHeight; // Trigger reflow

                // Set canvas size with device pixel ratio for crisp rendering
                const rect = canvas.getBoundingClientRect();
                console.log('[iframe] Canvas rect:', rect.width, 'x', rect.height);

                // Ensure minimum size for mobile/narrow viewports
                const width = Math.max(rect.width, 320);
                const height = Math.max(rect.height, 200);

                const dpr = window.devicePixelRatio || 1;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';

                // Initialize transform for zooming/panning
                transform = d3.zoomIdentity;

                // Mouse interaction handling
                let draggedNode = null;
                let isDraggingNode = false;
                let mouseX, mouseY;
                let mouseDownPos = null;
                let isMouseDown = false;
                const DRAG_THRESHOLD = 10; // pixels - minimum movement to start dragging

                startSimulation(width, height);

                // Set up zoom behavior with conditional activation
                zoom = d3.zoom()
                    .scaleExtent([0.25, 3])
                    .on('zoom', (event) => {
                        // Apply zoom only if not dragging a node
                        if (!isDraggingNode) {
                            if (event.sourceEvent) {
                                userAdjustedView = true;
                            }
                            transform = event.transform;
                            render();
                        }
                    })
                    .filter((event) => {
                        // Allow zoom with mouse wheel or when no node under cursor
                        if (event.type === 'wheel') return true;
                        if (event.type === 'mousedown' && event.button === 0) {
                            const pos = getMousePos(event);
                            const node = findNode(pos.x, pos.y);
                            return !node;
                        }
                        return true;
                    });

                d3.select(canvas).call(zoom);

                function getMousePos(event) {
                    const rect = canvas.getBoundingClientRect();
                    return {
                        x: (event.clientX - rect.left - transform.x) / transform.k,
                        y: (event.clientY - rect.top - transform.y) / transform.k
                    };
                }

                function findNode(x, y) {
                    for (let i = nodes.length - 1; i >= 0; i--) {
                        const node = nodes[i];
                        const dx = x - node.x;
                        const dy = y - node.y;
                        if (dx * dx + dy * dy < node.radius * node.radius) {
                            return node;
                        }
                    }
                    return null;
                }

                function findEdge(x, y) {
                    for (let i = edges.length - 1; i >= 0; i--) {
                        const edge = edges[i];
                        if (!edge.source || !edge.target) continue;

                        // Check if click is near the edge line
                        const dx = edge.target.x - edge.source.x;
                        const dy = edge.target.y - edge.source.y;
                        const length = Math.sqrt(dx * dx + dy * dy);
                        if (length === 0) continue;

                        const dot = ((x - edge.source.x) * dx + (y - edge.source.y) * dy) / (length * length);
                        if (dot < 0 || dot > 1) continue;

                        const projX = edge.source.x + dot * dx;
                        const projY = edge.source.y + dot * dy;
                        const distSq = (x - projX) * (x - projX) + (y - projY) * (y - projY);

                        if (distSq < 25) { // 5px threshold
                            return edge;
                        }
                    }
                    return null;
                }

                // Prevent context menu on right click
                canvas.addEventListener('contextmenu', (event) => {
                    event.preventDefault();
                    return false;
                });

                canvas.addEventListener('mousedown', (event) => {
                    // Allow event only for primary button (left click)
                    if (event.button !== 0) return;

                    const pos = getMousePos(event);
                    mouseX = pos.x;
                    mouseY = pos.y;
                    mouseDownPos = { x: pos.x, y: pos.y };
                    isMouseDown = true;
                    draggedNode = findNode(pos.x, pos.y);

                    if (draggedNode) {
                        event.preventDefault();
                        event.stopPropagation();
                        // Don't start dragging immediately - wait for movement
                        canvas.style.cursor = 'grabbing';
                    }
                });

                canvas.addEventListener('mousemove', (event) => {
                    // Allow event only for primary button (left click)
                    if (event.button !== 0) return;
                    const pos = getMousePos(event);

                    if (draggedNode && isDraggingNode) {
                        // Already dragging - continue moving the node
                        draggedNode.fx = pos.x;
                        draggedNode.fy = pos.y;
                    } else if (draggedNode && isMouseDown && mouseDownPos) {
                        // Check if mouse moved enough to start dragging
                        const dx = pos.x - mouseDownPos.x;
                        const dy = pos.y - mouseDownPos.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance > DRAG_THRESHOLD) {
                            // Start dragging
                            isDraggingNode = true;
                            simulation.alphaTarget(0.1).restart();
                            draggedNode.fx = draggedNode.x;
                            draggedNode.fy = draggedNode.y;
                        }
                    } else if (!isDraggingNode && !isMouseDown) {
                        // Update cursor based on what's under mouse
                        const node = findNode(pos.x, pos.y);
                        const edge = findEdge(pos.x, pos.y);
                        canvas.style.cursor = (node || edge) ? 'pointer' : 'grab';
                    }
                });

                canvas.addEventListener('mouseup', (event) => {
                    // Allow event only for primary button (left click)
                    if (event.button !== 0) return;

                    if (draggedNode) {
                        if (isDraggingNode) {
                            // Was actually dragging - stop the drag
                            simulation.alphaTarget(0);
                            draggedNode.fx = null;
                            draggedNode.fy = null;
                        }
                        // Reset node reference
                        draggedNode = null;
                        canvas.style.cursor = 'grab';
                    }

                    // Reset all mouse states
                    isMouseDown = false;
                    isDraggingNode = false;
                    mouseDownPos = null;
                });

                canvas.addEventListener('click', (event) => {
                    // Only handle click if we weren't dragging
                    if (isDraggingNode) return;

                    const pos = getMousePos(event);
                    const node = findNode(pos.x, pos.y);
                    const edge = findEdge(pos.x, pos.y);

                    if (node) {
                        setActiveElement({ type: 'node', id: node.id });
                    } else if (edge) {
                        setActiveElement({ type: 'edge', id: edge.id });
                    } else {
                        clearActiveElement();
                    }
                });

                // Handle window resize
                window.addEventListener('resize', resizeCanvas);

                render();
                startUpdatedEdgePulse();
            }

            function resizeCanvas() {
                if (!canvas || !ctx) return;

                // Force canvas to take full container size
                if (state.sidebarDisabled) {
                    canvas.style.width = '100%';
                    canvas.style.height = '100%';
                }

                const rect = canvas.getBoundingClientRect();
                console.log('Canvas resize - rect:', rect.width, 'x', rect.height);

                // Ensure minimum size for mobile
                const width = Math.max(rect.width, 320);
                const height = Math.max(rect.height, 200);

                const dpr = window.devicePixelRatio || 1;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';

                // Update simulation center
                if (simulation) {
                    simulation.force('center', d3.forceCenter(width / 2, height / 2));
                    simulation.alpha(0.3).restart();
                }

                render();
            }


            function render() {
                if (!ctx || !canvas) return;

                // Clear canvas
                const canvasWidth = canvas.width / (window.devicePixelRatio || 1);
                const canvasHeight = canvas.height / (window.devicePixelRatio || 1);
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);

                if (!nodes.length) {
                    ctx.save();
                    ctx.fillStyle = '#64748b';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = '14px Inter, system-ui, sans-serif';
                    ctx.fillText(
                        'No active relations in this snapshot',
                        canvasWidth / 2,
                        canvasHeight / 2
                    );
                    ctx.restore();
                    return;
                }

                // Apply transform
                ctx.save();
                ctx.translate(transform.x, transform.y);
                ctx.scale(transform.k, transform.k);

                // Set text properties
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = '12px Inter, system-ui, sans-serif';
                const edgePulse = updatedEdgePulseStrength();

                // Draw edges first
                edges.forEach(edge => {
                    if (!edge.source || !edge.target) return;

                    const isHighlighted = highlightedEdges.has(edge.id);
                    const isDimmed = isFiltering && !isHighlighted;

                    // Calculate edge endpoints accounting for node radius
                    const dx = edge.target.x - edge.source.x;
                    const dy = edge.target.y - edge.source.y;
                    const distance = Math.sqrt(dx * dx + dy * dy) || 1;
                    const normX = dx / distance;
                    const normY = dy / distance;

                    const sourcePadding = edge.source.radius + 2;
                    const targetPadding = edge.target.radius + 8;
                    const sourceX = edge.source.x + normX * sourcePadding;
                    const sourceY = edge.source.y + normY * sourcePadding;
                    const targetX = edge.target.x - normX * targetPadding;
                    const targetY = edge.target.y - normY * targetPadding;

                    if (edge.updated && edgePulse > 0) {
                        ctx.strokeStyle = edge.color;
                        ctx.globalAlpha = 0.1 + edgePulse * 0.18;
                        ctx.lineWidth = 4 + edgePulse * 3;
                        ctx.beginPath();
                        ctx.moveTo(sourceX, sourceY);
                        ctx.lineTo(targetX, targetY);
                        ctx.stroke();
                    }

                    // Draw edge line
                    ctx.strokeStyle = edge.color;
                    ctx.globalAlpha = isDimmed ? 0.15 : (isHighlighted ? 1.0 : 0.55);
                    ctx.lineWidth = edge.updated ? 2.2 : 1.4;
                    ctx.beginPath();
                    ctx.moveTo(sourceX, sourceY);
                    ctx.lineTo(targetX, targetY);
                    ctx.stroke();

                    // Draw arrowhead
                    const arrowLength = 12;
                    const arrowWidth = 24;
                    const angle = Math.atan2(dy, dx);

                    ctx.fillStyle = edge.color;
                    ctx.beginPath();
                    ctx.moveTo(targetX, targetY);
                    ctx.lineTo(
                        targetX - arrowLength * Math.cos(angle - arrowWidth * Math.PI / 180),
                        targetY - arrowLength * Math.sin(angle - arrowWidth * Math.PI / 180)
                    );
                    ctx.lineTo(
                        targetX - arrowLength * Math.cos(angle + arrowWidth * Math.PI / 180),
                        targetY - arrowLength * Math.sin(angle + arrowWidth * Math.PI / 180)
                    );
                    ctx.closePath();
                    ctx.fill();

                    // Draw edge label if zoom level is appropriate
                    if (transform.k > 0.8) {
                        const labelX = (sourceX + targetX) / 2;
                        const labelY = (sourceY + targetY) / 2;

                        ctx.fillStyle = isDimmed ? 'rgba(30, 41, 59, 0.15)' : 'rgba(30, 41, 59, 0.8)';
                        ctx.font = '10px Inter, system-ui, sans-serif';
                        ctx.fillText(edge.predicate, labelX, labelY);
                    }
                });

                // Draw nodes
                nodes.forEach(node => {
                    const isHighlighted = highlightedNodes.has(node.id);
                    const isDimmed = isFiltering && !isHighlighted;

                    // Draw node circle
                    ctx.fillStyle = node.color;
                    ctx.globalAlpha = isDimmed ? 0.15 : 1.0;
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, node.radius, 0, 2 * Math.PI);
                    ctx.fill();

                    // Draw node border
                    ctx.strokeStyle = '#0f172a';
                    ctx.lineWidth = isHighlighted ? 2.4 : 1.2;
                    ctx.stroke();

                    // Draw node label
                    if (transform.k > 0.5) {
                        ctx.fillStyle = isDimmed ? 'rgba(15, 23, 42, 0.15)' : '#0f172a';
                        ctx.font = '12px Inter, system-ui, sans-serif';
                        ctx.fillText(node.label, node.x, node.y + node.radius + 14);
                    }
                });

                ctx.restore();
                ctx.globalAlpha = 1.0;
            }

            function updateHighlights() {
                // Clear previous highlights
                highlightedNodes.clear();
                highlightedEdges.clear();
                isFiltering = false;

                const addNode = id => {
                    if (id) {
                        highlightedNodes.add(id);
                    }
                };
                const addEdge = id => {
                    if (id) {
                        highlightedEdges.add(id);
                    }
                };

                if (state.activeElement) {
                    isFiltering = true;
                    if (state.activeElement.type === 'node') {
                        const node = nodeById[state.activeElement.id];
                        addNode(node.id);
                        node.neighbors.forEach(addNode);
                        (node.edgeIds.outgoing || []).forEach(addEdge);
                        (node.edgeIds.incoming || []).forEach(addEdge);
                    } else if (state.activeElement.type === 'edge') {
                        const edge = edgeById[state.activeElement.id];
                        addEdge(edge.id);
                        addNode(edge.source);
                        addNode(edge.target);
                    }
                }

                if (state.focusCluster && nodesByCluster[state.focusCluster]) {
                    isFiltering = true;
                    nodesByCluster[state.focusCluster].forEach(addNode);
                    vizData.edges.forEach(edge => {
                        if (
                            nodesByCluster[state.focusCluster].has(edge.source) &&
                            nodesByCluster[state.focusCluster].has(edge.target)
                        ) {
                            addEdge(edge.id);
                        }
                    });
                }

                if (state.focusPredicate && edgesByPredicate[state.focusPredicate]) {
                    isFiltering = true;
                    edgesByPredicate[state.focusPredicate].forEach(edgeId => {
                        addEdge(edgeId);
                        const edge = edgeById[edgeId];
                        addNode(edge.source);
                        addNode(edge.target);
                    });
                }

                if (state.searchTerm) {
                    const term = state.searchTerm.toLowerCase();
                    isFiltering = true;
                    vizData.nodes.forEach(node => {
                        if (node.label.toLowerCase().includes(term)) {
                            addNode(node.id);
                            node.neighbors.forEach(addNode);
                        }
                    });
                    vizData.edges.forEach(edge => {
                        if (edge.predicate.toLowerCase().includes(term)) {
                            addEdge(edge.id);
                            addNode(edge.source);
                            addNode(edge.target);
                        }
                    });
                }

                // Trigger re-render with updated highlights
                render();
            }

            function toggleSidebar() {
                if (state.sidebarDisabled) return;

                state.sidebarCollapsed = !state.sidebarCollapsed;
                const layout = document.querySelector('.layout');
                const sidebar = document.querySelector('.sidebar');
                const toggleButton = document.getElementById('sidebarToggle');

                layout.classList.toggle('sidebar-collapsed', state.sidebarCollapsed);
                sidebar.classList.toggle('collapsed', state.sidebarCollapsed);
                toggleButton.classList.toggle('collapsed', state.sidebarCollapsed);

                // Trigger canvas resize when sidebar toggles
                setTimeout(() => {
                    resizeCanvas();
                }, 300); // Wait for transition to complete
            }

            function disableSidebar() {
                state.sidebarDisabled = true;

                const layout = document.querySelector('.layout');
                const sidebar = document.querySelector('.sidebar');
                const toggleButton = document.getElementById('sidebarToggle');
                const main = document.querySelector('.main');
                const tabPanel = document.querySelector('.tab-panel');
                const networkPanel = document.querySelector('.network-panel');

                layout.classList.add('sidebar-disabled');
                sidebar.style.display = 'none';
                toggleButton.style.display = 'none';

                // Force styles directly for iframe context
                main.style.width = '100%';
                main.style.height = '100vh';
                tabPanel.style.padding = '0';
                tabPanel.style.width = '100%';
                tabPanel.style.height = '100vh';
                networkPanel.style.width = '100%';
                networkPanel.style.height = '100vh';
                networkPanel.style.borderRadius = '0';
                networkPanel.style.border = 'none';

                console.log('Sidebar disabled, forcing full width styles');

                // Multiple resize attempts with forced reflow
                setTimeout(() => {
                    canvas.offsetHeight; // Trigger reflow
                    console.log('First resize attempt after 200ms');
                    resizeCanvas();
                }, 200);

                setTimeout(() => {
                    canvas.offsetHeight; // Trigger reflow
                    console.log('Second resize attempt after 500ms');
                    resizeCanvas();
                }, 500);

                setTimeout(() => {
                    canvas.offsetHeight; // Trigger reflow
                    console.log('Final resize attempt after 800ms');
                    resizeCanvas();
                }, 800);

                // Notify parent about graph data
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'graphDataReady',
                        data: vizData
                    }, '*');
                }
            }

            function bindInteractions() {
                document.getElementById('clusterList').addEventListener('click', event => {
                    const item = event.target.closest('.cluster-item');
                    if (item) {
                        toggleClusterFocus(item.getAttribute('data-cluster'));
                    }
                });

                document.getElementById('topRelations').addEventListener('click', event => {
                    const item = event.target.closest('.relation-item');
                    if (item) {
                        togglePredicateFocus(item.getAttribute('data-predicate'));
                    }
                });

                document.getElementById('snapshotSlider').addEventListener('input', event => {
                    activateVisibleSnapshot(Number(event.target.value));
                });
                document.getElementById('policyOnlySnapshots').addEventListener('change', event => {
                    setPolicyOnlySnapshots(event.target.checked);
                });
                document.getElementById('showContradictionOverrideCard').addEventListener('change', event => {
                    showContradictionOverrideCard = event.target.checked;
                    renderManualOverrides();
                });
                document.getElementById('policyBookmarks').addEventListener('click', event => {
                    const bookmark = event.target.closest('.policy-bookmark');
                    if (bookmark) {
                        activateSnapshot(Number(bookmark.dataset.snapshotIndex));
                    }
                });
                document.getElementById('manualOverridePanel').addEventListener('click', event => {
                    const selectButton = event.target.closest('.manual-override-action');
                    if (selectButton) {
                        applyManualOverride(
                            selectButton.dataset.decisionId,
                            selectButton.dataset.factId
                        );
                        return;
                    }
                    const clearButton = event.target.closest('.manual-override-clear');
                    if (clearButton) {
                        applyManualOverride(clearButton.dataset.clearDecisionId, null);
                    }
                });
                document.getElementById('manualOverridePanel').addEventListener('change', event => {
                    const recomputeToggle = event.target.closest('.manual-recompute-toggle');
                    if (recomputeToggle) {
                        setRecomputedOverrideBranch(
                            recomputeToggle.dataset.decisionId,
                            recomputeToggle.checked
                        );
                    }
                });
                document.getElementById('previousSnapshot').addEventListener('click', () => {
                    activateVisibleSnapshot(
                        visibleSnapshotIndices.indexOf(snapshotIndex) - 1
                    );
                });
                document.getElementById('nextSnapshot').addEventListener('click', () => {
                    activateVisibleSnapshot(
                        visibleSnapshotIndices.indexOf(snapshotIndex) + 1
                    );
                });
                document.addEventListener('keydown', event => {
                    if (
                        event.defaultPrevented ||
                        event.altKey ||
                        event.ctrlKey ||
                        event.metaKey ||
                        event.shiftKey ||
                        !['ArrowLeft', 'ArrowRight'].includes(event.key)
                    ) {
                        return;
                    }

                    const target = event.target;
                    const isEditable = target instanceof HTMLElement && (
                        target.isContentEditable ||
                        ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName)
                    );
                    if (isEditable || visibleSnapshotIndices.length <= 1) return;

                    event.preventDefault();
                    activateVisibleSnapshot(
                        visibleSnapshotIndices.indexOf(snapshotIndex) +
                        (event.key === 'ArrowRight' ? 1 : -1)
                    );
                });

                // document.getElementById('relationsTable').addEventListener('click', event => {
                //     const row = event.target.closest('tr');
                //     if (!row) {
                //         return;
                //     }
                //     const edgeId = row.getAttribute('data-edge');
                //     if (edgeId) {
                //         setActiveElement({ type: 'edge', id: edgeId });
                //     }
                // });

                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', () => {
                    state.searchTerm = searchInput.value.trim();
                    updateHighlights();

                    // Notify parent about search change
                    if (window.parent !== window && state.sidebarDisabled) {
                        window.parent.postMessage({
                            type: 'searchChanged',
                            searchTerm: state.searchTerm
                        }, '*');
                    }
                });
                searchInput.addEventListener('keydown', event => {
                    if (event.key === 'Escape') {
                        searchInput.value = '';
                        state.searchTerm = '';
                        updateHighlights();
                    }
                });

                document.querySelectorAll('.tab').forEach(tab => {
                    tab.addEventListener('click', event => {
                        const target = event.currentTarget;
                        document.querySelectorAll('.tab').forEach(button => button.classList.remove('active'));
                        target.classList.add('active');
                        const tabId = target.getAttribute('data-tab');
                        document.querySelectorAll('.tab-panel').forEach(panel => {
                            panel.classList.toggle('active', panel.id === tabId);
                        });
                    });
                });

                document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);

                // Listen for messages from parent
                window.addEventListener('message', (event) => {
                    if (event.data.type === 'disableInternalSidebar') {
                        disableSidebar();
                    } else if (event.data.type === 'search') {
                        state.searchTerm = event.data.term || '';
                        updateHighlights();
                    } else if (event.data.type === 'focusCluster') {
                        toggleClusterFocus(event.data.clusterId);
                    } else if (event.data.type === 'focusPredicate') {
                        togglePredicateFocus(event.data.predicate);
                    } else if (event.data.type === 'focusEntity') {
                        toggleEntityFocus(event.data.id);
                    }
                });

            }

            renderStats();
            renderTopLists();
            renderClusters();
            renderSnapshotControls();
            renderDecisions();
            renderManualOverrides();
            // renderRelationsTable();
            // renderInsights();

            // Delay network creation to ensure proper layout
            setTimeout(() => {
                createNetwork();
                bindInteractions();
            }, 100);
        })();
    </script>
</body>

</html>
